<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Name Generator</title>
    <style>
        :root {
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --bg-overlay: rgba(15, 23, 42, 0.85);
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: url('bg.png') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Dark overlay to ensure text readability over bg.png */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-overlay);
            z-index: -1;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            max-width: 600px;
            border: 1px solid var(--glass-border);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: var(--primary);
            margin-bottom: 1.5rem;
            font-size: 2rem;
            border-bottom: 2px solid var(--glass-border);
            padding-bottom: 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            letter-spacing: 1px;
        }

        .selector {
            margin-bottom: 20px;
            padding: 12px 15px;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            color: white;
            font-size: 1.1rem;
            width: 100%;
            cursor: pointer;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            appearance: none; /* Remove default arrow */
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2338bdf8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 15px top 50%;
            background-size: 12px auto;
        }

        .selector:hover, .selector:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .selector option {
            background: #0f172a;
            color: white;
        }

        button {
            width: 100%;
            padding: 14px;
            margin: 15px 0 10px;
            border-radius: 10px;
            border: none;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(14, 165, 233, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        #result-list {
            margin-top: 20px;
            text-align: left;
            background: rgba(15, 23, 42, 0.6);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            max-height: 250px;
            overflow-y: auto;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Custom Scrollbar */
        #result-list::-webkit-scrollbar {
            width: 8px;
        }
        #result-list::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
        }
        #result-list::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }

        .name-item {
            padding: 10px 0;
            border-bottom: 1px solid var(--glass-border);
            font-size: 1.15rem;
            color: #e2e8f0;
            display: flex;
            justify-content: space-between;
            animation: fadeIn 0.3s ease-in;
        }
        .name-item:last-child { border-bottom: none; }
        .name-item span { font-weight: bold; color: var(--primary); }

        #description-box {
            margin-top: 20px;
            background: rgba(51, 65, 85, 0.6);
            padding: 15px;
            border-radius: 10px;
            border-left: 5px solid var(--primary);
            text-align: left;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #cbd5e1;
            min-height: 60px;
        }
        #description-box h3 { margin-top: 0; color: var(--primary); font-size: 1.1rem; }

        #image-container {
            margin-top: 20px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 12px;
            border: 2px solid var(--glass-border);
            background: rgba(15, 23, 42, 0.4);
            position: relative;
        }

        #creature-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
            display: none;
            animation: zoomIn 0.5s ease-out;
        }

        /* Placeholder icon when no image */
        .no-image-placeholder {
            color: var(--text-muted);
            font-size: 3rem;
            opacity: 0.3;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        .back-btn {
            background: rgba(71, 85, 105, 0.5);
            margin-top: 15px;
            font-size: 0.9rem;
            padding: 10px;
        }
        .back-btn:hover {
            background: rgba(71, 85, 105, 0.8);
            box-shadow: none;
        }

        @media (max-width: 600px) {
            .container { padding: 1.5rem; }
            h1 { font-size: 1.5rem; }
            #image-container { height: 200px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="page-title">Loading...</h1>
    
    <select id="generator-selector" class="selector" onchange="changeGenerator()">
        <option value="horse">Horse Names</option>
        <option value="treant">Tree People Names</option>
        <option value="artifact">Special Item Names</option>
        <option value="centaur">Centaur Names</option>
        <option value="mermaid">Mermaid Names</option>
        <option value="conutaur">Conutaur Names</option>
        <option value="elf">Elf Names</option>
    </select>

    <button onclick="generateNames()">✨ Generate 10 Names</button>
    
    <div id="result-list"></div>
    
    <div id="description-box">
        <h3 id="desc-title">Info</h3>
        <p id="desc-text">Loading data...</p>
    </div>
    
    <div id="image-container">
        <span class="no-image-placeholder" id="img-placeholder">🖼️</span>
        <img id="creature-image" src="" alt="Creature">
    </div>
    
    <button class="back-btn" onclick="window.location.reload()">↻ Refresh Page</button>
</div>

<script>
    const DATA_URL = "https://jeff-web-sketch.github.io/FantasyNameGenerator/data.json";
    
    let allData = {};
    let currentCategory = "horse";

    fetch(DATA_URL)
        .then(response => {
            if (!response.ok) throw new Error("Network response was not ok.");
            return response.json();
        })
        .then(data => {
            allData = data;
            initGenerator();
        })
        .catch(error => {
            console.error("Error fetching data:", error);
            document.getElementById('desc-text').innerText = "Error: Could not load data.json. Ensure GitHub Pages is enabled.";
            document.getElementById('page-title').innerText = "Connection Error";
        });

    function initGenerator() {
        changeGenerator();
    }

    function changeGenerator() {
        currentCategory = document.getElementById('generator-selector').value;
        const data = allData[currentCategory];
        
        if (!data) return;

        const title = currentCategory.charAt(0).toUpperCase() + currentCategory.slice(1);
        document.getElementById('page-title').innerText = title + " Generator";
        document.getElementById('desc-title').innerText = title;
        
        let desc = "";
        if(currentCategory === "horse") desc = "Names reflecting coat color, personality, or majestic titles.";
        if(currentCategory === "treant") desc = "Names combining tree species with ancient titles or body parts.";
        if(currentCategory === "artifact") desc = "Names using elemental adjectives and legendary nouns.";
        if(currentCategory === "centaur") desc = "Names blending equine strength with warrior or nature themes.";
        if(currentCategory === "mermaid") desc = "Names evoking the ocean, tides, and marine life.";
        if(currentCategory === "conutaur") desc = "Names mixing celestial unicorn magic with centaur power.";
        if(currentCategory === "elf") desc = "Melodic names inspired by nature, stars, and ancient lore.";
        document.getElementById('desc-text').innerHTML = `<strong>${title}:</strong> ${desc}`;

        document.getElementById('result-list').innerHTML = '';
        const imgElement = document.getElementById('creature-image');
        const placeholder = document.getElementById('img-placeholder');
        imgElement.style.display = 'none';
        imgElement.src = "";
        placeholder.style.display = 'block';
    }

    function generateNames() {
        if (!allData[currentCategory]) return;
        
        const resultList = document.getElementById('result-list');
        resultList.innerHTML = '';
        const starts = allData[currentCategory].starts;
        const ends = allData[currentCategory].ends;

        for (let i = 0; i < 10; i++) {
            const randomStart = starts[Math.floor(Math.random() * starts.length)];
            const randomEnd = ends[Math.floor(Math.random() * ends.length)];
            const div = document.createElement('div');
            div.className = 'name-item';
            
            const format = Math.random() > 0.5 ? `${randomStart}${randomEnd}` : `${randomStart} of ${randomEnd}`;
            div.innerHTML = `<span>${i + 1}.</span> ${format}`;
            resultList.appendChild(div);
        }
        
        loadRandomImage(currentCategory);
    }

    function loadRandomImage(category) {
        const imgElement = document.getElementById('creature-image');
        const placeholder = document.getElementById('img-placeholder');
        imgElement.style.display = 'none';
        imgElement.src = "";
        placeholder.style.display = 'none'; // Hide placeholder while loading

        const validImages = [];
        let checksCompleted = 0;
        const maxImages = 10;

        for (let i = 1; i <= maxImages; i++) {
            const src = `${category}${i}.jpg`;
            const testImg = new Image();
            
            testImg.onload = function() {
                validImages.push(src);
                checkCompletion();
            };
            
            testImg.onerror = function() {
                checkCompletion();
            };
            
            testImg.src = src;
        }

        function checkCompletion() {
            checksCompleted++;
            if (checksCompleted === maxImages) {
                if (validImages.length > 0) {
                    const randomSrc = validImages[Math.floor(Math.random() * validImages.length)];
                    imgElement.src = randomSrc;
                    imgElement.style.display = 'block';
                } else {
                    // Show placeholder if no images found
                    placeholder.style.display = 'block';
                    console.log(`No images found for ${category}`);
                }
            }
        }
    }
</script>
</body>
</html>
