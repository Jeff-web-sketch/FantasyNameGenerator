<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Name Generator</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #1e293b; padding: 2.5rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; width: 550px; max-width: 90%; border: 1px solid #334155; }
        h1 { color: #38bdf8; margin-bottom: 1.5rem; font-size: 1.8rem; border-bottom: 2px solid #334155; padding-bottom: 10px; }
        button { width: 100%; padding: 12px; margin: 15px 0 10px; border-radius: 8px; border: none; font-size: 1.1rem; font-weight: bold; cursor: pointer; background: #0ea5e9; color: white; transition: background 0.2s; }
        button:hover { background: #0284c7; }
        #result-list { margin-top: 20px; text-align: left; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; max-height: 250px; overflow-y: auto; }
        .name-item { padding: 8px 0; border-bottom: 1px solid #334155; font-size: 1.2rem; color: #e2e8f0; display: flex; justify-content: space-between; }
        .name-item:last-child { border-bottom: none; }
        .name-item span { font-weight: bold; color: #38bdf8; }
        #description-box { margin-top: 20px; background: #334155; padding: 15px; border-radius: 8px; border-left: 5px solid #38bdf8; text-align: left; font-size: 0.95rem; line-height: 1.5; color: #e2e8f0; min-height: 80px; }
        #description-box h3 { margin-top: 0; color: #38bdf8; font-size: 1.1rem; }
        #image-container { margin-top: 20px; height: 250px; display: flex; justify-content: center; align-items: center; overflow: hidden; border-radius: 10px; border: 2px solid #334155; background: #0f172a; }
        #creature-image { max-width: 100%; max-height: 100%; object-fit: cover; display: none; animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .selector { margin-bottom: 20px; padding: 12px; border-radius: 8px; background: #334155; border: 1px solid #475569; color: white; font-size: 1rem; width: 100%; cursor: pointer; outline: none; }
        .selector option { background: #1e293b; color: white; }
        .back-btn { background: #475569; margin-top: 10px; }
        .back-btn:hover { background: #334155; }
    </style>
</head>
<body>
<div class="container">
    <h1 id="page-title">Loading...</h1>
    
    <!-- Generator Selector -->
<select id="generator-selector" class="selector" onchange="changeGenerator()">
    <option value="horse">Horse Names</option>
    <option value="treant">Tree People Names</option>
    <option value="artifact">Special Item Names</option>
    <option value="centaur">Centaur Names</option>
    <option value="mermaid">Mermaid Names</option>
    <option value="conutaur">Conutaur Names</option>
    <option value="elf">Elf Names</option>
</select>   

    <button onclick="generateNames()">✨ Generate 10 Names</button>
    <div id="result-list"></div>
    <div id="description-box"><h3 id="desc-title">Info</h3><p id="desc-text">Loading data...</p></div>
    <div id="image-container"><img id="creature-image" src="" alt="Creature"></div>
    <button class="back-btn" onclick="window.location.reload()">↻ Refresh Page</button>
</div>

<script>
    // --- CONFIGURATION ---
    // Using GitHub Pages URL to avoid CORS errors
    const DATA_URL = "https://jeff-web-sketch.github.io/FantasyNameGenerator/data.json";
    
    let allData = {};
    let currentCategory = "horse";

    // --- FETCH DATA ON LOAD ---
    fetch(DATA_URL)
        .then(response => {
            if (!response.ok) throw new Error("Network response was not ok. Check if GitHub Pages is enabled.");
            return response.json();
        })
        .then(data => {
            allData = data;
            initGenerator();
        })
        .catch(error => {
            console.error("Error fetching data:", error);
            document.getElementById('desc-text').innerText = "Error: Could not load data.json. Ensure GitHub Pages is enabled in repo settings.";
            document.getElementById('page-title').innerText = "Error";
        });

    function initGenerator() {
        changeGenerator(); // Load default category
    }

    function changeGenerator() {
        currentCategory = document.getElementById('generator-selector').value;
        const data = allData[currentCategory];
        
        if (!data) return;

        // Update UI Text
        const title = currentCategory.charAt(0).toUpperCase() + currentCategory.slice(1);
        document.getElementById('page-title').innerText = title + " Generator";
        document.getElementById('desc-title').innerText = title;
        
        // Update Description
        let desc = "";
        if(currentCategory === "horse") desc = "<strong>Horse:</strong> Names reflect coat color, personality, or majestic titles.";
        if(currentCategory === "treant") desc = "<strong>Tree People:</strong> Names combine tree species with ancient titles or body parts.";
        if(currentCategory === "artifact") desc = "<strong>Special Items:</strong> Names use elemental adjectives and legendary nouns.";
        if(currentCategory === "centaur") desc = "<strong>Centaur:</strong> Names blend equine strength with warrior or nature themes.";
        if(currentCategory === "mermaid") desc = "<strong>Mermaid:</strong> Names evoke the ocean, tides, and marine life.";
        if(currentCategory === "conutaur") desc = "<strong>Conutaur:</strong> Names mix celestial unicorn magic with centaur power.";
        document.getElementById('desc-text').innerHTML = desc;
        if(currentCategory === "elf") desc = "<strong>Elf:</strong> Names are melodic, flowing, and often inspired by nature or stars.";


        // Clear previous results and image
        document.getElementById('result-list').innerHTML = '';
        const imgElement = document.getElementById('creature-image');
        imgElement.style.display = 'none';
        imgElement.src = "";
    }

    function generateNames() {
        if (!allData[currentCategory]) return;
        
        const resultList = document.getElementById('result-list');
        resultList.innerHTML = '';
        const starts = allData[currentCategory].starts;
        const ends = allData[currentCategory].ends;

        for (let i = 0; i < 10; i++) {
            const randomStart = starts[Math.floor(Math.random() * starts.length)];
            const randomEnd = ends[Math.floor(Math.random() * ends.length)];
            const div = document.createElement('div');
            div.className = 'name-item';
            
            // Randomly choose format: "StartEnd" or "Start of End"
            const format = Math.random() > 0.5 ? `${randomStart}${randomEnd}` : `${randomStart} of ${randomEnd}`;
            div.innerHTML = `<span>${i + 1}.</span> ${format}`;
            resultList.appendChild(div);
        }
        
        loadRandomImage(currentCategory);
    }

    function loadRandomImage(category) {
        const imgElement = document.getElementById('creature-image');
        imgElement.style.display = 'none';
        imgElement.src = "";

        const validImages = [];
        let checksCompleted = 0;
        const maxImages = 10;

        // Check for category1.jpg to category10.jpg
        for (let i = 1; i <= maxImages; i++) {
            const src = `${category}${i}.jpg`;
            const testImg = new Image();
            
            testImg.onload = function() {
                validImages.push(src);
                checkCompletion();
            };
            
            testImg.onerror = function() {
                checkCompletion();
            };
            
            testImg.src = src;
        }

        function checkCompletion() {
            checksCompleted++;
            if (checksCompleted === maxImages) {
                if (validImages.length > 0) {
                    // Pick a random image from the found ones
                    const randomSrc = validImages[Math.floor(Math.random() * validImages.length)];
                    imgElement.src = randomSrc;
                    imgElement.style.display = 'block';
                } else {
                    // No images found, keep box blank
                    console.log(`No images found for ${category}. Expected files: ${category}1.jpg to ${category}10.jpg`);
                }
            }
        }
    }
</script>
</body>
</html>
