<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Name Generator</title>
    <style>
        :root { --primary: #38bdf8; --primary-hover: #0ea5e9; --accent: #f472b6; --bg-overlay: rgba(15, 23, 42, 0.85); --glass-bg: rgba(30, 41, 59, 0.7); --glass-border: rgba(255, 255, 255, 0.1); --text-main: #f8fafc; --text-muted: #94a3b8; }
        body { font-family: 'Segoe UI', sans-serif; background: url('bg.png') no-repeat center center fixed; background-size: cover; color: var(--text-main); display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        body::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg-overlay); z-index: -1; }
        .container { background: var(--glass-bg); backdrop-filter: blur(12px); padding: 2rem; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); width: 100%; max-width: 650px; border: 1px solid var(--glass-border); animation: slideUp 0.6s ease-out; margin-bottom: 20px; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        h1 { color: var(--primary); margin: 0 0 1rem 0; font-size: 1.8rem; text-align: center; }
        .search-box { width: 100%; padding: 10px 15px; margin-bottom: 15px; border-radius: 10px; border: 1px solid var(--glass-border); background: rgba(15, 23, 42, 0.6); color: white; font-size: 1rem; box-sizing: border-box; outline: none; }
        .search-box:focus { border-color: var(--primary); }
        .quick-switch { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 15px; max-height: 100px; overflow-y: auto; }
        .switch-btn { background: rgba(15, 23, 42, 0.6); border: 1px solid var(--glass-border); color: var(--text-muted); padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; white-space: nowrap; }
        .switch-btn:hover, .switch-btn.active { background: var(--primary); color: white; border-color: var(--primary); transform: translateY(-2px); }
        .switch-btn.hidden { display: none; }
        .selector { margin-bottom: 15px; padding: 12px; border-radius: 10px; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--glass-border); color: white; font-size: 1.1rem; width: 100%; cursor: pointer; outline: none; }
        .generate-btn { width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: none; font-size: 1.1rem; font-weight: bold; cursor: pointer; background: linear-gradient(135deg, var(--primary), var(--primary-hover)); color: white; transition: transform 0.2s; }
        .generate-btn:hover { transform: translateY(-2px); }
        #result-list { margin-top: 15px; text-align: left; background: rgba(15, 23, 42, 0.6); padding: 10px; border-radius: 10px; border: 1px solid var(--glass-border); max-height: 300px; overflow-y: auto; }
        .name-item { padding: 10px; border-bottom: 1px solid var(--glass-border); font-size: 1.1rem; color: #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        .name-item:last-child { border-bottom: none; }
        .save-btn { background: transparent; border: 1px solid var(--text-muted); color: var(--text-muted); padding: 4px 8px; border-radius: 5px; cursor: pointer; font-size: 0.8rem; margin-left: 10px; transition: all 0.2s; }
        .save-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(244, 114, 182, 0.1); }
        .save-btn.saved { background: var(--accent); color: white; border-color: var(--accent); }
        #saved-section { margin-top: 20px; text-align: left; background: rgba(15, 23, 42, 0.4); padding: 15px; border-radius: 10px; border: 1px dashed var(--glass-border); max-height: 300px; overflow-y: auto; }
        .category-group { margin-bottom: 15px; }
        .category-header { color: var(--primary); font-size: 0.9rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 2px; }
        .saved-item { display: flex; justify-content: space-between; font-size: 0.95rem; color: var(--text-muted); padding: 3px 0; }
        .saved-item span:last-child { color: #ef4444; cursor: pointer; }
        #description-box { margin-top: 15px; background: rgba(51, 65, 85, 0.6); padding: 12px; border-radius: 8px; border-left: 4px solid var(--primary); text-align: left; font-size: 0.9rem; color: #cbd5e1; min-height: 60px; }
        #image-container { margin-top: 15px; height: 200px; display: flex; justify-content: center; align-items: center; overflow: hidden; border-radius: 12px; border: 2px solid var(--glass-border); background: rgba(15, 23, 42, 0.4); }
        #creature-image { max-width: 100%; max-height: 100%; object-fit: cover; display: none; }
        .no-image-placeholder { color: var(--text-muted); font-size: 3rem; opacity: 0.3; }
        
        /* Download Button Style */
        .action-btn {
            background: rgba(15, 23, 42, 0.6); border: 1px solid var(--glass-border);
            color: var(--text-main); padding: 6px 12px; border-radius: 6px;
            cursor: pointer; font-size: 0.85rem; margin-left: 8px; transition: all 0.2s;
        }
        .action-btn:hover { background: var(--primary); border-color: var(--primary); color: white; }
        .action-btn.danger { border-color: #ef4444; color: #ef4444; }
        .action-btn.danger:hover { background: #ef4444; color: white; }
    </style>
</head>
<body>
<div class="container">
    <h1 id="page-title">Loading...</h1>
    <input type="text" id="search-input" class="search-box" placeholder="🔍 Search generators..." onkeyup="filterGenerators()">
    <div class="quick-switch" id="quick-switch-container"></div>
    <select id="generator-selector" class="selector" onchange="changeGenerator()"></select>
    <button class="generate-btn" onclick="generateNames()">✨ Generate 10 Names</button>
    <div id="result-list"></div>
    
    <div id="saved-section">
        <h3 style="margin:0 0 10px 0; color:var(--accent); font-size:1rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
            <span>Saved Collection</span>
            <div style="display:flex; gap:5px;">
                <button class="action-btn" onclick="downloadSavedNames()">⬇ Download .txt</button>
                <button class="action-btn danger" onclick="clearSavedNames()">Clear All</button>
            </div>
        </h3>
        <div id="saved-list-container"></div>
    </div>

    <div id="description-box"><strong>About:</strong> <span id="desc-text">Select a generator to begin.</span></div>
    <div id="image-container">
        <span class="no-image-placeholder" id="img-placeholder">🖼️</span>
        <img id="creature-image" src="" alt="Creature">
    </div>
</div>

<script>
    const DATA_URL = "https://jeff-web-sketch.github.io/FantasyNameGenerator/data.json";
    let allData = {};
    let currentCategory = "horse";
    let isDataLoaded = false;
    let savedNames = JSON.parse(localStorage.getItem('fantasyNamesSaved')) || [];

    fetch(DATA_URL)
        .then(response => { if (!response.ok) throw new Error("Network error"); return response.json(); })
        .then(data => { allData = data; isDataLoaded = true; initUI(); })
        .catch(error => { document.getElementById('desc-text').innerText = "Error loading data."; });

    function initUI() {
        const switchContainer = document.getElementById('quick-switch-container');
        const select = document.getElementById('generator-selector');
        Object.keys(allData).forEach(cat => {
            const opt = document.createElement('option'); opt.value = cat; opt.innerText = cat.charAt(0).toUpperCase() + cat.slice(1); select.appendChild(opt);
            const btn = document.createElement('button'); btn.className = 'switch-btn'; btn.innerText = cat.charAt(0).toUpperCase() + cat.slice(1); btn.dataset.category = cat;
            btn.onclick = () => { select.value = cat; changeGenerator(); };
            switchContainer.appendChild(btn);
        });
        changeGenerator();
    }

    function filterGenerators() {
        const query = document.getElementById('search-input').value.toLowerCase();
        document.querySelectorAll('.switch-btn').forEach(btn => {
            btn.classList.toggle('hidden', !btn.innerText.toLowerCase().includes(query));
        });
    }

    function changeGenerator() {
        if (!isDataLoaded) return;
        currentCategory = document.getElementById('generator-selector').value;
        document.querySelectorAll('.switch-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.category === currentCategory));
        document.getElementById('result-list').innerHTML = '';
        const img = document.getElementById('creature-image'); 
        const placeholder = document.getElementById('img-placeholder');
        img.src = ""; img.style.display = 'none';
        placeholder.style.display = 'block';

        const title = currentCategory.charAt(0).toUpperCase() + currentCategory.slice(1);
        document.getElementById('page-title').innerText = title + " Generator";
        
        const descs = {
            horse: "Domesticated ungulates known for speed, strength, and loyalty.",
            treant: "Sentient, ancient tree beings that guard forests.",
            artifact: "Magical items, weapons, or relics imbued with supernatural powers.",
            centaur: "Mythological hybrids: human upper body, horse lower body. Skilled warriors.",
            mermaid: "Aquatic beings: human upper body, fish tail. Dwell in oceans.",
            elf: "Immortal humanoids with pointed ears. Masters of magic and nature.",
            dragon: "Massive reptilian creatures with scales, wings, and elemental breath.",
            twilek: "Near-human species from Ryloth with two head-tails (lekku).",
            togruta: "Near-human species from Shili with montrals, lekku, and facial markings.",
            faun: "Forest spirits: human upper body, goat legs and horns. Lovers of music.",
            conutaur: "Rare hybrid: centaur body with a unicorn's spiraled horn."
        };
        document.getElementById('desc-text').innerHTML = `<strong>${title}:</strong> ${descs[currentCategory] || "Fantasy creatures."}`;
        generateNames();
    }

    function generateNames() {
        if (!isDataLoaded) return;
        const list = document.getElementById('result-list'); 
        list.innerHTML = '';
        const starts = allData[currentCategory].starts; 
        const ends = allData[currentCategory].ends;
        
        for (let i = 0; i < 10; i++) {
            const s = starts[Math.floor(Math.random() * starts.length)];
            const e = ends[Math.floor(Math.random() * ends.length)];
            const name = `${s}${e}`;
            
            const isSaved = savedNames.some(item => item.name === name && item.category === currentCategory);
            const div = document.createElement('div'); div.className = 'name-item';
            
            const btn = document.createElement('button');
            btn.className = `save-btn ${isSaved ? 'saved' : ''}`;
            btn.innerHTML = isSaved ? '★ Saved' : '☆ Save';
            btn.onclick = function(e) { e.stopPropagation(); toggleSaveState(name, currentCategory, btn); };
            
            div.innerHTML = `<span>${name}</span>`; 
            div.appendChild(btn); 
            list.appendChild(div);
        }
        loadRandomImage(currentCategory);
    }

    function toggleSaveState(name, category, btnElement) {
        const index = savedNames.findIndex(item => item.name === name && item.category === category);
        if (index > -1) {
            savedNames.splice(index, 1);
            btnElement.innerHTML = '☆ Save';
            btnElement.classList.remove('saved');
        } else {
            savedNames.push({ name, category });
            btnElement.innerHTML = '★ Saved';
            btnElement.classList.add('saved');
        }
        localStorage.setItem('fantasyNamesSaved', JSON.stringify(savedNames));
        renderSavedNames();
    }

    function toggleSave(name, category) {
        const index = savedNames.findIndex(item => item.name === name && item.category === category);
        if (index > -1) savedNames.splice(index, 1); else savedNames.push({ name, category });
        localStorage.setItem('fantasyNamesSaved', JSON.stringify(savedNames));
        renderSavedNames();
        const buttons = document.querySelectorAll('.save-btn');
        buttons.forEach(btn => {
            const nameSpan = btn.previousElementSibling;
            if(nameSpan && nameSpan.innerText === name) {
                const isNowSaved = savedNames.some(i => i.name === name && i.category === category);
                btn.innerHTML = isNowSaved ? '★ Saved' : '☆ Save';
                btn.classList.toggle('saved', isNowSaved);
            }
        });
    }

    function renderSavedNames() {
        const container = document.getElementById('saved-list-container'); container.innerHTML = '';
        if (savedNames.length === 0) { container.innerHTML = '<div style="text-align:center; color:#64748b; padding:10px;">No saved names yet.</div>'; return; }
        const grouped = {};
        savedNames.forEach(item => { if (!grouped[item.category]) grouped[item.category] = []; grouped[item.category].push(item.name); });
        for (const [cat, names] of Object.entries(grouped)) {
            const groupDiv = document.createElement('div'); groupDiv.className = 'category-group';
            const header = document.createElement('div'); header.className = 'category-header';
            header.innerText = `${cat.charAt(0).toUpperCase() + cat.slice(1)} Names (${names.length})`; groupDiv.appendChild(header);
            names.forEach(name => {
                const itemDiv = document.createElement('div'); itemDiv.className = 'saved-item';
                itemDiv.innerHTML = `<span>${name}</span>`;
                const delBtn = document.createElement('span'); delBtn.innerText = '✕'; delBtn.style.color = '#ef4444'; delBtn.style.cursor = 'pointer';
                delBtn.onclick = function() { toggleSave(name, cat); };
                itemDiv.appendChild(delBtn); groupDiv.appendChild(itemDiv);
            });
            container.appendChild(groupDiv);
        }
    }

    function clearSavedNames() { if(confirm("Clear all?")) { savedNames = []; localStorage.removeItem('fantasyNamesSaved'); renderSavedNames(); } }

    // --- DOWNLOAD FUNCTION ---
    function downloadSavedNames() {
        if (savedNames.length === 0) {
            alert("No names saved to download!");
            return;
        }

        // Group names by category
        const grouped = {};
        savedNames.forEach(item => {
            if (!grouped[item.category]) grouped[item.category] = [];
            grouped[item.category].push(item.name);
        });

        // Build text content
        let content = "FANTASY NAME GENERATOR - SAVED COLLECTION\n";
        content += "Generated on: " + new Date().toLocaleDateString() + "\n";
        content += "==========================================\n\n";

        for (const [cat, names] of Object.entries(grouped)) {
            const title = cat.charAt(0).toUpperCase() + cat.slice(1);
            content += `--- ${title} Names ---\n`;
            names.forEach(name => {
                content += `${name}\n`;
            });
            content += "\n";
        }

        // Create blob and download
        const blob = new Blob([content], { type: 'text/plain' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'fantasy-names-saved.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
    }

    function loadRandomImage(category) {
        const img = document.getElementById('creature-image'); 
        const placeholder = document.getElementById('img-placeholder');
        img.style.display = 'none'; 
        placeholder.style.display = 'none';
        const valid = []; 
        let count = 0;
        const maxImages = 10;
        for(let i=1; i<=maxImages; i++) {
            const t = new Image();
            t.onload = () => { valid.push(`${category}${i}.jpg`); check(); };
            t.onerror = () => check();
            t.src = `${category}${i}.jpg`;
        }
        function check() { 
            count++; 
            if(count === maxImages) { 
                if(valid.length > 0) { 
                    img.src = valid[Math.floor(Math.random() * valid.length)]; 
                    img.style.display = 'block'; 
                } else { 
                    placeholder.style.display = 'block'; 
                } 
            } 
        }
    }
</script>
</body>
</html>
