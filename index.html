<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Name Generator</title>
    <style>
        :root {
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --accent: #f472b6;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --glass-bg: rgba(30, 41, 59, 0.4); /* More transparent */
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: url('bg.png') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Dark overlay to ensure text readability while keeping bg visible */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.3); /* Lighter overlay */
            z-index: -1;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(12px); /* Frosted glass effect */
            -webkit-backdrop-filter: blur(12px);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: var(--glass-shadow);
            width: 100%;
            max-width: 700px;
            border: 1px solid var(--glass-border);
            animation: slideUp 0.6s ease-out;
            margin-bottom: 20px;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: var(--primary);
            margin: 0 0 1.5rem 0;
            font-size: 2rem;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            font-weight: 700;
        }

        .search-box {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(15, 23, 42, 0.5);
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }
        .search-box:focus { border-color: var(--primary); background: rgba(15, 23, 42, 0.7); }

        .quick-switch {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            max-height: 120px;
            overflow-y: auto;
            padding: 5px;
        }
        
        /* Custom Scrollbar for buttons */
        .quick-switch::-webkit-scrollbar { width: 6px; }
        .quick-switch::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 3px; }

        .switch-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            white-space: nowrap;
            backdrop-filter: blur(4px);
        }
        .switch-btn:hover, .switch-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);
        }
        .switch-btn.hidden { display: none; }

        .selector {
            margin-bottom: 20px;
            padding: 14px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            color: white;
            font-size: 1.1rem;
            width: 100%;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(4px);
        }

        .generate-btn {
            width: 100%;
            padding: 16px;
            margin: 10px 0;
            border-radius: 12px;
            border: none;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            transition: transform 0.2s, box-shadow 0.2s;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.4);
        }

        #result-list {
            margin-top: 20px;
            text-align: left;
            background: rgba(15, 23, 42, 0.4);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            max-height: 300px;
            overflow-y: auto;
        }
        .name-item {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 1.15rem;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.3s ease-in;
        }
        .name-item:last-child { border-bottom: none; }
        
        .save-btn {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            margin-left: 10px;
            transition: all 0.2s;
        }
        .save-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(244, 114, 182, 0.1);
        }
        .save-btn.saved {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 2px 8px rgba(244, 114, 182, 0.4);
        }

        #saved-section {
            margin-top: 25px;
            text-align: left;
            background: rgba(15, 23, 42, 0.3);
            padding: 20px;
            border-radius: 12px;
            border: 1px dashed var(--glass-border);
            max-height: 300px;
            overflow-y: auto;
        }
        .category-group { margin-bottom: 15px; }
        .category-header {
            color: var(--primary);
            font-size: 0.95rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }
        .saved-item {
            display: flex;
            justify-content: space-between;
            font-size: 1rem;
            color: var(--text-muted);
            padding: 4px 0;
        }
        .saved-item span:last-child { color: #ef4444; cursor: pointer; transition: color 0.2s; }
        .saved-item span:last-child:hover { color: #f87171; }

        #description-box {
            margin-top: 20px;
            background: rgba(51, 65, 85, 0.4);
            padding: 15px;
            border-radius: 12px;
            border-left: 5px solid var(--primary);
            text-align: left;
            font-size: 1rem;
            color: var(--text-main);
            line-height: 1.5;
            min-height: 50px;
            backdrop-filter: blur(4px);
        }
        #description-box strong { color: var(--primary); }

        #image-container {
            margin-top: 20px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 16px;
            border: 2px solid var(--glass-border);
            background: rgba(15, 23, 42, 0.3);
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
        }
        #creature-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
            display: none;
            animation: zoomIn 0.5s ease-out;
            border-radius: 14px;
        }
        .no-image-placeholder { color: var(--text-muted); font-size: 4rem; opacity: 0.3; }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .action-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }
        .action-btn:hover { background: var(--primary); border-color: var(--primary); color: white; }
        .action-btn.danger { border-color: rgba(239, 68, 68, 0.5); color: #fca5a5; }
        .action-btn.danger:hover { background: #ef4444; border-color: #ef4444; color: white; }

        @media (max-width: 600px) {
            .container { padding: 1.5rem; }
            h1 { font-size: 1.6rem; }
            .action-bar { flex-direction: column; }
            .action-btn { width: 100%; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1 id="page-title">Loading...</h1>
    <input type="text" id="search-input" class="search-box" placeholder="🔍 Search generators..." onkeyup="filterGenerators()">
    <div class="quick-switch" id="quick-switch-container"></div>
    <select id="generator-selector" class="selector" onchange="changeGenerator()"></select>
    <button class="generate-btn" onclick="generateNames()">✨ Generate 10 Names</button>
    <div id="result-list"></div>
    
    <div id="saved-section">
        <div class="action-bar">
            <h3 style="margin:0; color:var(--accent); font-size:1.1rem;">Saved Collection</h3>
            <div style="display:flex; gap:8px;">
                <button class="action-btn" onclick="downloadSavedNames()">⬇ Download .txt</button>
                <button class="action-btn danger" onclick="clearSavedNames()">Clear All</button>
            </div>
        </div>
        <div id="saved-list-container" style="margin-top:15px;"></div>
    </div>

    <div id="description-box"><strong>About:</strong> <span id="desc-text">Select a generator to begin.</span></div>
    
    <div id="image-container">
        <span class="no-image-placeholder" id="img-placeholder">🖼️</span>
        <img id="creature-image" src="" alt="Creature">
    </div>
    
    <div style="margin-top: 20px; text-align: center;">
        <button class="action-btn" onclick="window.open('script-info.html', '_blank')">🐍 View Python Script</button>
    </div>
</div>

<script>
    const DATA_URL = "https://jeff-web-sketch.github.io/FantasyNameGenerator/data.json";
    let allData = {};
    let currentCategory = "horse";
    let isDataLoaded = false;
    let savedNames = JSON.parse(localStorage.getItem('fantasyNamesSaved')) || [];

    fetch(DATA_URL)
        .then(response => { if (!response.ok) throw new Error("Network error"); return response.json(); })
        .then(data => { allData = data; isDataLoaded = true; initUI(); })
        .catch(error => { document.getElementById('desc-text').innerText = "Error loading data."; });

    function initUI() {
        const switchContainer = document.getElementById('quick-switch-container');
        const select = document.getElementById('generator-selector');
        Object.keys(allData).forEach(cat => {
            const opt = document.createElement('option'); opt.value = cat; opt.innerText = cat.charAt(0).toUpperCase() + cat.slice(1); select.appendChild(opt);
            const btn = document.createElement('button'); btn.className = 'switch-btn'; btn.innerText = cat.charAt(0).toUpperCase() + cat.slice(1); btn.dataset.category = cat;
            btn.onclick = () => { select.value = cat; changeGenerator(); };
            switchContainer.appendChild(btn);
        });
        changeGenerator();
    }

    function filterGenerators() {
        const query = document.getElementById('search-input').value.toLowerCase();
        document.querySelectorAll('.switch-btn').forEach(btn => {
            btn.classList.toggle('hidden', !btn.innerText.toLowerCase().includes(query));
        });
    }

    function changeGenerator() {
        if (!isDataLoaded) return;
        currentCategory = document.getElementById('generator-selector').value;
        document.querySelectorAll('.switch-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.category === currentCategory));
        document.getElementById('result-list').innerHTML = '';
        const img = document.getElementById('creature-image'); 
        const placeholder = document.getElementById('img-placeholder');
        img.src = ""; img.style.display = 'none';
        placeholder.style.display = 'block';

        const title = currentCategory.charAt(0).toUpperCase() + currentCategory.slice(1);
        document.getElementById('page-title').innerText = title + " Generator";
        
        const descs = {
            horse: "Domesticated ungulates known for speed, strength, and loyalty.",
            treant: "Sentient, ancient tree beings that guard forests.",
            artifact: "Magical items, weapons, or relics imbued with supernatural powers.",
            centaur: "Mythological hybrids: human upper body, horse lower body. Skilled warriors.",
            mermaid: "Aquatic beings: human upper body, fish tail. Dwell in oceans.",
            elf: "Immortal humanoids with pointed ears. Masters of magic and nature.",
            dragon: "Massive reptilian creatures with scales, wings, and elemental breath.",
            twilek: "Near-human species from Ryloth with two head-tails (lekku).",
            togruta: "Near-human species from Shili with montrals, lekku, and facial markings.",
            faun: "Forest spirits: human upper body, goat legs and horns. Lovers of music.",
            conutaur: "Rare hybrid: centaur body with a unicorn's spiraled horn.",
            orc: "Brutal warriors with harsh, guttural names. Known for strength.",
            dwarf: "Sturdy miners and smiths. Names reference stone and metal.",
            werewolf: "Lycanthropes tied to the moon. Names reflect fur and claws.",
            goblin: "Mischievous tinkerers. Names are short, snappy, and comical.",
            android: "Synthetic beings. Names use alphanumeric codes and futuristic sounds.",
            cyborg: "Half-human, half-machine. Names blend organic and mechanical terms.",
            phoenix: "Immortal firebirds. Names evoke flames, rebirth, and solar power.",
            kraken: "Massive sea monsters. Names reference the deep ocean and tentacles.",
            golem: "Animated constructs of clay or stone. Names reflect earth materials.",
            hydra: "Multi-headed serpentine monsters. Names evoke venom and coils.",
            griffin: "Majestic hybrids: lion body, eagle head. Names reflect sky and nobility.",
            sphinx: "Enigmatic guardians with riddles. Names reference wisdom and mysteries.",
            banshee: "Female spirits whose wails foretell death. Names are mournful.",
            chimera: "Fire-breathing hybrids of lion, goat, and serpent. Names reflect mixed beasts.",
            basilisk: "Reptilian kings whose gaze turns victims to stone."
        };
        document.getElementById('desc-text').innerHTML = `<strong>${title}:</strong> ${descs[currentCategory] || "Fantasy creatures."}`;
        generateNames();
    }

    function generateNames() {
        if (!isDataLoaded) return;
        const list = document.getElementById('result-list'); 
        list.innerHTML = '';
        const starts = allData[currentCategory].starts; 
        const ends = allData[currentCategory].ends;
        
        for (let i = 0; i < 10; i++) {
            const s = starts[Math.floor(Math.random() * starts.length)];
            const e = ends[Math.floor(Math.random() * ends.length)];
            const name = `${s}${e}`;
            
            const isSaved = savedNames.some(item => item.name === name && item.category === currentCategory);
            const div = document.createElement('div'); div.className = 'name-item';
            
            const btn = document.createElement('button');
            btn.className = `save-btn ${isSaved ? 'saved' : ''}`;
            btn.innerHTML = isSaved ? '★ Saved' : '☆ Save';
            btn.onclick = function(e) { e.stopPropagation(); toggleSaveState(name, currentCategory, btn); };
            
            div.innerHTML = `<span>${name}</span>`; 
            div.appendChild(btn); 
            list.appendChild(div);
        }
        loadRandomImage(currentCategory);
    }

    function toggleSaveState(name, category, btnElement) {
        const index = savedNames.findIndex(item => item.name === name && item.category === category);
        if (index > -1) {
            savedNames.splice(index, 1);
            btnElement.innerHTML = '☆ Save';
            btnElement.classList.remove('saved');
        } else {
            savedNames.push({ name, category });
            btnElement.innerHTML = '★ Saved';
            btnElement.classList.add('saved');
        }
        localStorage.setItem('fantasyNamesSaved', JSON.stringify(savedNames));
        renderSavedNames();
    }

    function toggleSave(name, category) {
        const index = savedNames.findIndex(item => item.name === name && item.category === category);
        if (index > -1) savedNames.splice(index, 1); else savedNames.push({ name, category });
        localStorage.setItem('fantasyNamesSaved', JSON.stringify(savedNames));
        renderSavedNames();
        const buttons = document.querySelectorAll('.save-btn');
        buttons.forEach(btn => {
            const nameSpan = btn.previousElementSibling;
            if(nameSpan && nameSpan.innerText === name) {
                const isNowSaved = savedNames.some(i => i.name === name && i.category === category);
                btn.innerHTML = isNowSaved ? '★ Saved' : '☆ Save';
                btn.classList.toggle('saved', isNowSaved);
            }
        });
    }

    function renderSavedNames() {
        const container = document.getElementById('saved-list-container'); container.innerHTML = '';
        if (savedNames.length === 0) { container.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:10px;">No saved names yet.</div>'; return; }
        const grouped = {};
        savedNames.forEach(item => { if (!grouped[item.category]) grouped[item.category] = []; grouped[item.category].push(item.name); });
        for (const [cat, names] of Object.entries(grouped)) {
            const groupDiv = document.createElement('div'); groupDiv.className = 'category-group';
            const header = document.createElement('div'); header.className = 'category-header';
            header.innerText = `${cat.charAt(0).toUpperCase() + cat.slice(1)} Names (${names.length})`; groupDiv.appendChild(header);
            names.forEach(name => {
                const itemDiv = document.createElement('div'); itemDiv.className = 'saved-item';
                itemDiv.innerHTML = `<span>${name}</span>`;
                const delBtn = document.createElement('span'); delBtn.innerText = '✕'; delBtn.style.cursor = 'pointer';
                delBtn.onclick = function() { toggleSave(name, cat); };
                itemDiv.appendChild(delBtn); groupDiv.appendChild(itemDiv);
            });
            container.appendChild(groupDiv);
        }
    }

    function clearSavedNames() { if(confirm("Clear all?")) { savedNames = []; localStorage.removeItem('fantasyNamesSaved'); renderSavedNames(); } }

    function downloadSavedNames() {
        if (savedNames.length === 0) { alert("No names saved!"); return; }
        const grouped = {};
        savedNames.forEach(item => { if (!grouped[item.category]) grouped[item.category] = []; grouped[item.category].push(item.name); });
        let content = "FANTASY NAME GENERATOR - SAVED COLLECTION\nGenerated: " + new Date().toLocaleDateString() + "\n==========================================\n\n";
        for (const [cat, names] of Object.entries(grouped)) {
            content += `--- ${cat.charAt(0).toUpperCase() + cat.slice(1)} Names ---\n`;
            names.forEach(n => content += `${n}\n`);
            content += "\n";
        }
        const blob = new Blob([content], { type: 'text/plain' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = 'fantasy-names-saved.txt';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
    }

    function loadRandomImage(category) {
        const img = document.getElementById('creature-image'); 
        const placeholder = document.getElementById('img-placeholder');
        img.style.display = 'none'; placeholder.style.display = 'none';
        const valid = []; let count = 0; const maxImages = 10;
        for(let i=1; i<=maxImages; i++) {
            const t = new Image();
            t.onload = () => { valid.push(`${category}${i}.jpg`); check(); };
            t.onerror = () => check();
            t.src = `${category}${i}.jpg`;
        }
        function check() { 
            count++; 
            if(count === maxImages) { 
                if(valid.length > 0) { img.src = valid[Math.floor(Math.random() * valid.length)]; img.style.display = 'block'; } 
                else { placeholder.style.display = 'block'; } 
            } 
        }
    }
</script>
</body>
</html>
